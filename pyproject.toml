[project]
name = "pulsefit-ai"
version = "0.1.0"
description = "Autonomous AI Agent for Hybrid Fitness Analytics & Coaching"
authors = [{name = "Nachiket Gadilohar", email = "nachiketlohar0306@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "google-genai>=0.3",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "api.index:app"
